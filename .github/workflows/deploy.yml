name: Deploy to Cloud Run

on:
  push:
    branches: ["main"]

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Auth to Google (OIDC)
        uses: google-github-actions/auth@v2
        with:
workload_identity_provider: "projects/672198683380/locations/global/workloadIdentityPools/github-pool/providers/github-provider"
          service_account: "gha-cloudrun-deployer@gcp-secure-cloudrun-api.iam.gserviceaccount.com"

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure docker auth for Artifact Registry
        run: |
          gcloud auth configure-docker europe-west2-docker.pkg.dev --quiet

      - name: Build and push image
        env:
          PROJECT_ID: gcp-secure-cloudrun-api
          REGION: europe-west2
          REPO: cloudrun-repo
          SERVICE: gcp-secure-cloudrun-api
        run: |
          IMAGE="${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPO}/${SERVICE}:${GITHUB_SHA}"
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> $GITHUB_ENV

      - name: Deploy to Cloud Run (no public access)
        env:
          REGION: europe-west2
          SERVICE: gcp-secure-cloudrun-api
        run: |
          gcloud run deploy "$SERVICE" \
            --image "$IMAGE" \
            --region "$REGION" \
            --platform managed \
            --no-allow-unauthenticated \
            --port 8080
